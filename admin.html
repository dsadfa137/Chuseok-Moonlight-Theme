<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>달빛 우체국 · 운영자</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./ranked.css"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"></head>
<body class="admin-body"><main class="admin-shell">
<h1>달빛 우체국 · 운영자</h1><p class="admin-intro">2026. 9. 25.(금) · 접수 및 기록 확인 · 공개 순위표에는 전화번호 뒤 4자리를 표시하지 않음</p>
<form id="admin-login" class="admin-login"><label for="admin-email" class="field-label">관리자 이메일</label><input id="admin-email" class="input" type="email" autocomplete="username" required><label for="admin-password" class="field-label">비밀번호</label><input id="admin-password" class="input" type="password" autocomplete="current-password" required><div class="button-stack"><button type="submit" class="primary">운영자 로그인</button></div><p class="format-note">Supabase에서 생성하고 관리자 명단에 등록한 계정으로 로그인합니다.</p></form>
<p id="admin-status" class="admin-alert" role="status" aria-live="polite"></p>
<section id="admin-console" hidden aria-label="참여 기록 관리">
<div id="admin-summary" class="admin-summary"></div>
<div class="admin-actions"><button id="entries-toggle" class="primary">접수 상태 확인</button><button id="admin-refresh" class="secondary">지금 새로고침</button><button id="export-csv" class="secondary">CSV 내려받기 (엑셀용)</button><button id="admin-logout" class="text-button">로그아웃</button></div>
<label class="export-choice"><input type="checkbox" id="export-private">내보내기에 전화번호 뒤 4자리 포함</label>
<p class="format-note">10초마다 갱신합니다. 접수 마감 후에도 이미 시작한 가족은 미션을 계속할 수 있습니다. 삭제는 순위 제외 방식이며 복구할 수 있습니다. 기념품 지급은 책자·지급대장으로 별도 확인합니다.</p>
<label class="field-label" for="admin-search">닉네임으로 찾기</label><input id="admin-search" class="input" type="search" placeholder="찾을 닉네임 입력" autocomplete="off">
<div class="rank-scroll"><table class="admin-table"><caption>전체 참여자 · 최근 시작 순</caption><thead><tr><th>닉네임</th><th>뒤 4자리</th><th>순위</th><th>소요 시간</th><th>시작 시각</th><th>완료 시각</th><th>미션</th><th>초대장</th><th>기록 관리</th></tr></thead><tbody id="admin-rows"></tbody></table></div>
</section><p class="format-note"><a href="./index.html">참여자 화면으로</a></p>
</main><script src="./config.js" defer></script><script src="./server-api.js" defer></script><script src="./admin.js" defer></script></body></html>
